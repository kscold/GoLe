# 로컬 호스트에서 `pnpm dev:api`로 실행할 때 적용되는 설정.
# 운영 컨테이너용 기본값(application.yml)과 로컬 Docker 인프라의 주소를 분리한다.
spring:
  data:
    mongodb:
      uri: "${MONGODB_URI:mongodb://localhost:${MONGODB_PORT:27017}/gole?replicaSet=rs0}"

storage:
  s3:
    endpoint: "${STORAGE_S3_ENDPOINT:http://localhost:${MINIO_API_PORT:9000}}"
    access-key: "${STORAGE_S3_ACCESS_KEY:${MINIO_ROOT_USER:minioadmin}}"
    secret-key: "${STORAGE_S3_SECRET_KEY:${MINIO_ROOT_PASSWORD:minioadmin}}"
  public-base-url: "${STORAGE_PUBLIC_BASE_URL:http://localhost:${SERVER_PORT:8080}}"

gole:
  seller-identity:
    verification-ready: ${GOLE_SELLER_IDENTITY_VERIFICATION_READY:true}
  onboarding:
    # 운영은 카카오 템플릿 승인 전까지 빈 값으로 두어 발송을 명시적으로 거부해야 한다(503).
    # 로컬은 LoggingAlimtalkSenderAdapter가 실제 발송 대신 로그만 남기므로 값이 있어도 안전하다.
    phone-verification-template-id: "${GOLE_ONBOARDING_PHONE_TEMPLATE_ID:local-dev-onboarding-otp}"
    # 로컬에는 코드를 받을 실제 알림톡이 없다. 이 값을 켜지 않으면 OTP가 해시로만 남고 로그도
    # 가려져 전화 인증을 끝까지 밟아볼 방법이 사라진다. 로컬 프로필에서만 여는 이유이며,
    # 공개 환경은 이 값이 true여도 PhoneVerificationCodeExposurePolicy가 환경을 보고 닫는다.
    log-verification-codes: ${GOLE_ONBOARDING_LOG_VERIFICATION_CODES:true}
