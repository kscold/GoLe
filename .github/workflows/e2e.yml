name: E2E (live UI smoke)

# 배포 사이트에는 별도의 GET/HEAD/OPTIONS 전용 smoke만 실행한다.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST

jobs:
  e2e:
    name: Playwright read-only smoke vs gole.co.kr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://gole.co.kr
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # 배포본에는 GET/HEAD/OPTIONS만 허용하는 전용 smoke만 실행한다. 로컬용 결제·쓰기
      # 시나리오와 응답 가로채기 기반 계약 테스트는 main CI의 격리 환경에서 검증한다.
      - name: Run read-only live smoke
        run: >-
          pnpm --filter web exec playwright test
          tests-e2e/live-smoke.spec.ts
          --project=chromium
          --reporter=github,html

      # 실패 시 HTML과 trace를 같은 artifact에 보존한다. SSH로 별도 서버에 복사하지 않는다.
      - name: Upload failed live smoke report
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-report-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
          if-no-files-found: warn
