name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 동일 ref의 이전 실행은 취소(최신만 유지)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Frontend (lint · format · typecheck · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high

      - name: Prettier (format check)
        run: pnpm --filter web format:check

      - name: ESLint (boundaries)
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: FSD lint (steiger)
        run: pnpm --filter web fsd:lint

      - name: Build
        run: pnpm --filter web build

  api:
    name: Backend (spotless · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Test & build
        run: ./gradlew build --no-daemon

      # build의 test는 *IntegrationTest를 제외한다(로컬에 Docker가 없을 수 있으므로).
      # CI 러너에는 Docker가 있으므로 여기서 Testcontainers 테스트를 실제로 돌린다.
      # 이 스텝이 없으면 단일 낙찰·exactly-once 정산 검증이 아무 데서도 실행되지 않는다.
      - name: Integration tests (Testcontainers)
        run: ./gradlew integrationTest --no-daemon

  support_agent:
    name: Support agent (locked deps · proto · test · image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned uv
        run: python -m pip install uv==0.10.2

      - name: Install locked dependencies
        working-directory: apps/support-agent
        run: uv sync --locked

      - name: Generate shared gRPC contract
        run: bash apps/support-agent/scripts/generate-proto.sh

      - name: Test deterministic LangGraph service
        working-directory: apps/support-agent
        run: uv run pytest

      - name: Build support agent image
        run: docker build -f apps/support-agent/Dockerfile -t gole/support-agent:ci .

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      # 구매 플로우 E2E는 주문·결제·정산을 실제로 거치므로 백엔드와 저장소가 필요하다.
      # mongo-init: replica set 초기화 — 없으면 멀티 도큐먼트 트랜잭션이 실패한다.
      # minio-init: 버킷과 읽기 정책 — 로컬 `pnpm infra:up`과 같은 상태를 맞춘다.
      #             (이미지는 API가 프록시하므로 공개 정책에 의존하지는 않는다)
      - name: Start infra (Mongo rs0 · Redis · MinIO)
        run: |
          docker compose up -d --wait mongo redis minio
          docker compose run --rm --no-deps mongo-init
          docker compose run --rm --no-deps minio-init

      - name: Build API jar
        working-directory: apps/api
        run: ./gradlew bootJar --no-daemon -x test

      - name: Start API
        working-directory: apps/api
        env:
          # E2E 전용 스텁 결제 준비 상태를 명시적으로 켠다. 운영 기본값은 계속 Stage 1로
          # 닫혀 있고, e2e 프로필+환경 조합이 아니면 API가 기동 자체를 거부한다.
          SPRING_PROFILES_ACTIVE: e2e
          GOLE_ENVIRONMENT: e2e
          MONGODB_URI: mongodb://localhost:27017/gole_e2e?replicaSet=rs0
          MONGODB_DATABASE: gole_e2e
          REDIS_DATABASE: "15"
          PORTONE_ENABLED: "false"
          GOLE_SETTLEMENT_MODE: MANUAL
          GOLE_SETTLEMENT_PAYOUT_CONTRACT_VERIFIED: "true"
          GOLE_SETTLEMENT_PAYOUT_HOLDBACK: PT0S
          # 앱이 러너 호스트에서 직접 뜨므로 컨테이너 전용 호스트명을 쓰면 안 된다.
          STORAGE_S3_ENDPOINT: http://localhost:9000
          STORAGE_S3_BUCKET: gole-e2e
          # 이미지 공개 주소는 MinIO가 아니라 API 원점이다 — MediaService가
          # publicBaseUrl + /api/v1/media/ 로 조립하고 MediaController가 그 경로를 서빙한다.
          # MinIO 주소를 넣으면 브라우저 CSP(img-src)가 그 원점을 막아 이미지가 안 뜬다.
          STORAGE_PUBLIC_BASE_URL: http://localhost:8080
          # spring.mail.host가 정의되어 있으면 Spring이 MailHealthIndicator를 자동 등록하고,
          # SMTP가 없는 환경에서는 그 지표 하나가 /actuator/health 전체를 DOWN(503)으로 만든다.
          # CI에는 SMTP를 붙이지 않으므로 이 지표를 끈다. Mongo·Redis 확인은 그대로 남는다.
          MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
        run: |
          nohup java -jar build/libs/*.jar > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::API failed to start"
          # 어느 지표가 DOWN인지 바로 보이게 남긴다. 로그만 있으면 원인 찾기가 훨씬 느리다.
          echo "--- /actuator/health ---"
          curl -sS http://localhost:8080/actuator/health || echo "(응답 없음)"
          echo "--- api.log ---"
          tail -100 "$RUNNER_TEMP/api.log"
          exit 1

      # 쓰기 플로우(create-listing·purchase)는 서버가 검증하는 실제 세션이 필요하다.
      # API가 뜬 뒤에 심는다 — 시더가 accounts 컬렉션을 만들어 둔 뒤여야 인덱스가 준비된다.
      - name: Seed E2E accounts and sessions
        env:
          MONGO_DB: gole_e2e
          REDIS_DATABASE: "15"
        run: bash scripts/seed-e2e-accounts.sh

      # E2E_WITH_BACKEND: 관리자 API 가드 테스트는 이 값이 없으면 조용히 스킵된다.
      # 백엔드가 실제로 떠 있는 이 잡이 그 테스트를 돌릴 수 있는 유일한 곳이다.
      #
      # 아래 NEXT_PUBLIC_* 는 Playwright가 띄우는 dev 서버(webServer)가 읽는다.
      # API_BASE_URL: next.config.ts가 이 원점을 CSP img-src에 넣는다. 없으면 API가 서빙하는
      #               매물 이미지가 차단돼 업로드 미리보기 단정이 실패한다.
      # PORTONE_*:    결제 요청 조립 계약 테스트가 기대하는 테스트 채널 값이다(실제 키 아님).
      #               PAYMENT_MODE까지 있어야 한다 — 기본값이 stub이면 isPortOneEnabled()가
      #               false여서 키를 넘겨도 계약 테스트가 통과하지 못한다.
      - name: E2E
        env:
          E2E_WITH_BACKEND: "1"
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          NEXT_PUBLIC_PAYMENT_MODE: portone-test
          NEXT_PUBLIC_PORTONE_STORE_ID: store-test
          NEXT_PUBLIC_PORTONE_CHANNEL_KEY: channel-kakaopay-test
          NEXT_PUBLIC_PORTONE_CARD_CHANNEL_KEY: channel-card-test
        run: pnpm --filter web e2e

      # CI 리포터는 github이라 playwright-report/(HTML)가 생성되지 않는다. 실패 원인을 볼 수
      # 있는 건 trace(on-first-retry)가 쌓이는 test-results/ 쪽이다.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: warn

      - name: API log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/api.log"

  mobile:
    name: Mobile (core · format · lint · typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 코어는 웹·앱이 함께 쓰므로 어느 한쪽 잡에만 두면 다른 쪽 회귀를 놓친다.
      # web 잡은 build로 코어를 간접 검증하고, 여기서 직접 검사한다.
      - name: Core (format · typecheck · platform)
        run: |
          pnpm --filter @gole/core format:check
          pnpm --filter @gole/core typecheck
          pnpm --filter @gole/core check:platform

      - name: Prettier (format check)
        run: pnpm --filter mobile format:check

      - name: ESLint
        run: pnpm --filter mobile lint

      - name: Typecheck
        run: pnpm --filter mobile typecheck

      # 네이티브 빌드는 여기서 하지 않는다 — macOS 러너가 필요하고 몇 분이 걸린다.
      # 번들이 되는지는 export로 확인한다. 워크스페이스 심링크 해석 회귀를 여기서 잡는다.
      - name: Metro bundle (iOS)
        run: pnpm --filter mobile exec expo export --platform ios --output-dir "$RUNNER_TEMP/expo-export"

  infra:
    name: Infra (budget relay · Compose · Terraform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The adoption policy renders the exact historical production SHA as
          # a regression fixture; a depth-1 checkout cannot prove that contract.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Budget relay unit tests
        run: python -m unittest discover -s infra/gcp/budget-relay/tests -p 'test_*.py'

      - name: Cost guard host watchdog
        run: |
          bash -n \
            infra/gcp/scripts/cost-guard-watchdog.sh \
            infra/gcp/scripts/bootstrap-host.sh \
            infra/gcp/scripts/apply-secret-env.sh \
            scripts/deploy.sh
          failure_file="$RUNNER_TEMP/gole-cost-guard-watchdog.failures"
          GOLE_COST_GUARD_CONTAINER_NAME=gole-nonexistent-ci \
          GOLE_COST_GUARD_FAILURE_FILE="$failure_file" \
          GOLE_COST_GUARD_WATCHDOG_DRY_RUN=true \
            bash infra/gcp/scripts/cost-guard-watchdog.sh
          if GOLE_COST_GUARD_CONTAINER_NAME=gole-nonexistent-ci \
            GOLE_COST_GUARD_FAILURE_FILE="$failure_file" \
            GOLE_COST_GUARD_WATCHDOG_DRY_RUN=true \
              bash infra/gcp/scripts/cost-guard-watchdog.sh; then
            echo "두 번째 연속 장애에서 watchdog이 실패해야 합니다." >&2
            exit 1
          fi

      - name: Secret Sync log security contract
        run: |
          GOLE_BOOTSTRAP_CONTRACT_STATIC_ONLY=true \
            bash infra/gcp/tests/bootstrap-contract.test.sh
          for infra_test in infra/gcp/tests/*.test.sh; do
            if [ "$infra_test" = infra/gcp/tests/bootstrap-contract.test.sh ]; then
              continue
            fi
            bash "$infra_test"
          done
          bash scripts/__tests__/secret-sync-security.test.sh
          bash scripts/__tests__/sync-dev-env-security.test.sh
          bash scripts/__tests__/onboarding-phone-policy-contract.test.sh
          bash scripts/__tests__/media-storage-boundary.test.sh
          node --test scripts/__tests__/migrate-production-demo-content.test.mjs

      - name: ShellCheck production host scripts
        run: |
          shellcheck --severity=warning \
            infra/gcp/scripts/*.sh \
            scripts/*.sh \
            scripts/__tests__/*.test.sh

      - name: GitHub Actions contract
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Docker Compose config
        env:
          GOLE_INFRA_ENV_FILE: ${{ github.workspace }}/infra/gcp/gole.env.example
          GOLE_APP_ENV_FILE: ${{ github.workspace }}/infra/gcp/gole.env.example
        run: docker compose -f infra/gcp/docker-compose.yml config --quiet

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.5

      - name: Terraform format
        run: terraform -chdir=infra/gcp/terraform fmt -check

      - name: Terraform init
        run: terraform -chdir=infra/gcp/terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=infra/gcp/terraform validate

  notify:
    name: Discord CI result
    if: ${{ always() && github.event_name == 'push' }}
    needs: [web, mobile, api, support_agent, e2e, infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DISCORD_CI_WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
      DISCORD_AVATAR_URL: https://gole.co.kr/icon.svg
      DISCORD_SUPPRESS_NOTIFICATIONS: ${{ vars.DISCORD_SUPPRESS_NOTIFICATIONS || 'true' }}
      WEB_RESULT: ${{ needs.web.result }}
      MOBILE_RESULT: ${{ needs.mobile.result }}
      API_RESULT: ${{ needs.api.result }}
      SUPPORT_AGENT_RESULT: ${{ needs.support_agent.result }}
      E2E_RESULT: ${{ needs.e2e.result }}
      INFRA_RESULT: ${{ needs.infra.result }}
    steps:
      - name: Notify GoLe operations channel
        if: ${{ env.DISCORD_CI_WEBHOOK_URL != '' }}
        continue-on-error: true
        run: |
          if [ "$WEB_RESULT" = success ] && [ "$MOBILE_RESULT" = success ] && [ "$API_RESULT" = success ] && [ "$SUPPORT_AGENT_RESULT" = success ] && [ "$E2E_RESULT" = success ] && [ "$INFRA_RESULT" = success ]; then
            status="✅ CI 통과"
          else
            status="❌ CI 실패"
          fi
          if [ "$DISCORD_SUPPRESS_NOTIFICATIONS" = "true" ]; then
            flags=4096
          else
            flags=null
          fi
          payload=$(jq -n \
            --arg content "$status · web=$WEB_RESULT · mobile=$MOBILE_RESULT · api=$API_RESULT · support-agent=$SUPPORT_AGENT_RESULT · e2e=$E2E_RESULT · infra=$INFRA_RESULT · $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg avatar_url "$DISCORD_AVATAR_URL" \
            --argjson flags "$flags" \
            '{content: $content, avatar_url: $avatar_url, allowed_mentions: {parse: []}}
             + (if $flags == null then {} else {flags: $flags} end)')
          curl -fsS --max-time 10 -H 'Content-Type: application/json' --data "$payload" "$DISCORD_CI_WEBHOOK_URL"
