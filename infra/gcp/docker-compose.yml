name: gole

x-logging: &gole-logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

x-security: &gole-security
  security_opt: ["no-new-privileges:true"]

services:
  mongo:
    <<: *gole-security
    image: mongo:7@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
    container_name: gole-mongo
    logging: *gole-logging
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1792m
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    networks: [data]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20

  mongo-init:
    <<: *gole-security
    image: mongo:7@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
    logging: *gole-logging
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    cpus: 0.25
    mem_limit: 256m
    networks: [data]
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            const cfg = rs.conf();
            if (cfg.members[0].host !== "mongo:27017") {
              cfg.version += 1;
              cfg.members[0].host = "mongo:27017";
              rs.reconfig(cfg, {force:true});
            }
          } catch (e) {
            rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]});
          }
        '

  redis:
    <<: *gole-security
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: gole-redis
    logging: *gole-logging
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 384m
    command: ["redis-server", "--appendonly", "yes"]
    networks: [data]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    <<: *gole-security
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: gole-minio
    logging: *gole-logging
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 768m
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: ["${GOLE_INFRA_ENV_FILE:-/etc/gole/infra.env}"]
    networks: [data]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    <<: *gole-security
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    logging: *gole-logging
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    cpus: 0.25
    mem_limit: 128m
    networks: [data]
    env_file: ["${GOLE_INFRA_ENV_FILE:-/etc/gole/infra.env}"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/gole
        mc anonymous set none local/gole

  support-agent:
    <<: *gole-security
    build:
      context: ../..
      dockerfile: apps/support-agent/Dockerfile
    image: gole/support-agent:local
    container_name: gole-support-agent
    logging: *gole-logging
    restart: unless-stopped
    environment:
      SUPPORT_AGENT_GRPC_PORT: "50051"
      SUPPORT_AGENT_WORKERS: ${SUPPORT_AGENT_WORKERS:-2}
      LOG_LEVEL: ${SUPPORT_AGENT_LOG_LEVEL:-INFO}
    expose: ["50051"]
    cpus: ${SUPPORT_AGENT_CPUS:-0.25}
    mem_limit: ${SUPPORT_AGENT_MEMORY_LIMIT:-192m}
    networks: [agent]
    healthcheck:
      test: ["CMD", "python", "-m", "gole_support_agent.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    <<: *gole-security
    build:
      context: ../..
      dockerfile: infra/gcp/docker/api.Dockerfile
    image: gole/backend:local
    container_name: gole-backend
    logging: *gole-logging
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2048m
    env_file: ["${GOLE_APP_ENV_FILE:-/etc/gole/gole.env}"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/gole?replicaSet=rs0
      REDIS_HOST: redis
      STORAGE_S3_ENDPOINT: http://minio:9000
      # 단일 GCP Compose는 운영 전용이다. 로컬 개발은 저장소 루트 Compose를 사용한다.
      GOLE_ENVIRONMENT: production
      # 초기 공개는 CoolSMS 템플릿 승인 전이므로 전화 단계를 온보딩 완료 조건에서 뺀다.
      GOLE_ONBOARDING_PHONE_REQUIRED: "false"
      GOLE_ONBOARDING_LOG_VERIFICATION_CODES: "false"
      # Stage 0는 SMTP를 보류한다. 인증코드가 필요한 기능은 API에서 503으로 닫고,
      # 기존 검증 계정 로그인과 별도 readiness를 통과한 OAuth만 유지한다.
      # validate-production-env.py/validate-production-compose.py는 이 래치를
      # 조건부로 검증한다(false면 아래 셋이 비어 있어야 하고, true면 셋 다 채워져
      # 있어야 한다). 이 Compose의 런타임 기본값은 여전히 false로 고정한다.
      GOLE_VERIFICATION_EMAIL_ENABLED: "false"
      GOLE_MAIL_HEALTH_ENABLED: "false"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      GOLE_VERIFICATION_EMAIL_FROM: ""
      GOLE_SESSION_COOKIE_SECURE: "true"
      GOLE_WEB_ALLOWED_ORIGINS: https://gole.co.kr,https://www.gole.co.kr
      GOLE_OAUTH_ALLOWED_REDIRECT_URIS: https://gole.co.kr/auth/callback/google,https://gole.co.kr/auth/callback/kakao,https://gole.co.kr/auth/callback/naver
      GOLE_TERMS_VERSION: "2026-09-04"
      GOLE_PRIVACY_VERSION: "2026-09-05"
      GOLE_THIRD_PARTY_PROVISION_VERSION: "2026-09-04"
      GOLE_SELLER_IDENTITY_VERIFICATION_READY: "false"
      # 공개 인증 레이트리밋은 Secret 값으로 완화할 수 없도록 운영 Compose에 고정한다.
      GOLE_AUTH_EMAIL_RECIPIENT_COOLDOWN_MAXIMUM: "1"
      GOLE_AUTH_EMAIL_RECIPIENT_COOLDOWN_WINDOW: PT1M
      GOLE_AUTH_EMAIL_RECIPIENT_DAILY_MAXIMUM: "8"
      GOLE_AUTH_EMAIL_RECIPIENT_DAILY_WINDOW: P1D
      GOLE_AUTH_EMAIL_CLIENT_BURST_MAXIMUM: "5"
      GOLE_AUTH_EMAIL_CLIENT_BURST_WINDOW: PT1M
      GOLE_AUTH_EMAIL_CLIENT_HOURLY_MAXIMUM: "30"
      GOLE_AUTH_EMAIL_CLIENT_HOURLY_WINDOW: PT1H
      GOLE_AUTH_EMAIL_GLOBAL_BURST_MAXIMUM: "60"
      GOLE_AUTH_EMAIL_GLOBAL_BURST_WINDOW: PT1M
      GOLE_AUTH_EMAIL_GLOBAL_DAILY_MAXIMUM: "300"
      GOLE_AUTH_EMAIL_GLOBAL_DAILY_WINDOW: P1D
      GOLE_AUTH_OAUTH_CLIENT_BURST_MAXIMUM: "20"
      GOLE_AUTH_OAUTH_CLIENT_BURST_WINDOW: PT1M
      GOLE_AUTH_OAUTH_CLIENT_HOURLY_MAXIMUM: "120"
      GOLE_AUTH_OAUTH_CLIENT_HOURLY_WINDOW: PT1H
      GOLE_AUTH_OAUTH_GLOBAL_BURST_MAXIMUM: "120"
      GOLE_AUTH_OAUTH_GLOBAL_BURST_WINDOW: PT1M
      GOLE_AUTH_OAUTH_GLOBAL_DAILY_MAXIMUM: "2000"
      GOLE_AUTH_OAUTH_GLOBAL_DAILY_WINDOW: P1D
      SMTP_AUTH: "true"
      SMTP_STARTTLS: "true"
      SMTP_STARTTLS_REQUIRED: "true"
      SMTP_SSL_CHECKSERVERIDENTITY: "true"
      GOLE_CATALOG_SEED: "false"
      GOLE_LISTING_SEED: "false"
      GOLE_PRICING_SEED: "false"
      GOLE_PRICING_INCLUDE_DEMO: "false"
      GOLE_PRICING_INCLUDE_LEGACY: "false"
      GOLE_COMMUNITY_SEED: "false"
      GOLE_REPORT_SEED: "false"
      GOLE_REVIEW_SEED: "false"
      GOLE_MEDIA_SEED: "false"
      PORTONE_ENABLED: "false"
      GOLE_SETTLEMENT_MODE: DISABLED
      GOLE_DISCORD_ALERTS_ENABLED: ${GOLE_DISCORD_ALERTS_ENABLED:-false}
      DISCORD_DEPLOY_WEBHOOK_URL: ${DISCORD_DEPLOY_WEBHOOK_URL:-}
      DISCORD_OPERATIONS_WEBHOOK_URL: ${DISCORD_OPERATIONS_WEBHOOK_URL:-}
      DISCORD_ACCOUNT_WEBHOOK_URL: ${DISCORD_ACCOUNT_WEBHOOK_URL:-}
      DISCORD_PAYMENT_WEBHOOK_URL: ${DISCORD_PAYMENT_WEBHOOK_URL:-}
      DISCORD_SUPPORT_WEBHOOK_URL: ${DISCORD_SUPPORT_WEBHOOK_URL:-}
      DISCORD_SUPPRESS_NOTIFICATIONS: ${DISCORD_SUPPRESS_NOTIFICATIONS:-true}
      # 문의 원문은 이 Compose 내부 서비스로만 전달한다. 운영 Secret으로 외부 target을
      # 덮어쓸 수 없게 해 개인정보처리방침의 외부 미전송 계약을 지킨다.
      GOLE_SUPPORT_AGENT_ENABLED: "true"
      GOLE_SUPPORT_AGENT_GRPC_TARGET: support-agent:50051
      GOLE_SUPPORT_AGENT_TIMEOUT: PT2S
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      support-agent:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
    networks: [data, edge, agent]
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8080/actuator/health/readiness",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  budget-relay:
    <<: *gole-security
    build:
      context: ./budget-relay
      dockerfile: Dockerfile
    image: gole/budget-relay:local
    container_name: gole-budget-relay
    logging: *gole-logging
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    networks: [edge]
    environment:
      # OAuth tokens never enter the container. A root-owned Unix broker exposes
      # only the fixed budget subscription and independently authorized stop.
      GOLE_CLOUD_BROKER_SOCKET: /run/gole-cloud-broker/broker.sock
      GCP_BUDGET_PUBSUB_SUBSCRIPTION: ${GCP_BUDGET_PUBSUB_SUBSCRIPTION:-gole-billing-budget-discord}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-project-72a52bf1-06aa-4519-b2c}
      GCP_CREDIT_AMOUNT_KRW: ${GCP_CREDIT_AMOUNT_KRW:-395600.60}
      GCP_CREDIT_DEADLINE: ${GCP_CREDIT_DEADLINE:-2026-10-28}
      # Post-resize e2-standard-2 + disk + in-use IPv4. The relay separately
      # models the pre-resize high-rate segment and every snapshot.
      GCP_FIXED_HOURLY_COST_KRW: ${GCP_FIXED_HOURLY_COST_KRW:-153.390555330}
      GCP_HIGH_RATE_HOURLY_COST_KRW: "240.749900000"
      GCP_RUNTIME_RATE_TRANSITION_AT: "2026-09-06T00:00:00+09:00"
      # Seoul regional snapshot $0.000068493/GiB-hour, 100GiB x 3 recovery
      # points, and a conservative 1,900 KRW/USD ceiling.
      GCP_SNAPSHOT_MAX_HOURLY_COST_KRW: "39.041010000"
      GCP_SNAPSHOT_RETENTION_HOURS: "72"
      GCP_MANUAL_SNAPSHOT_HOURLY_COST_KRW: "13.013670000"
      GCP_BUDGET_WARNING_THRESHOLDS: ${GCP_BUDGET_WARNING_THRESHOLDS:-0.50,0.75,0.85,0.90,0.95,1.00}
      GCP_HARD_STOP_ENABLED: ${GCP_HARD_STOP_ENABLED:-false}
      GCP_HARD_STOP_DRY_RUN: ${GCP_HARD_STOP_DRY_RUN:-false}
      GCP_HARD_STOP_BILLING_COST_KRW: ${GCP_HARD_STOP_BILLING_COST_KRW:-320000}
      GCP_HARD_STOP_MIN_RESERVE_KRW: ${GCP_HARD_STOP_MIN_RESERVE_KRW:-75000}
      GCP_HARD_STOP_ALL_IN_COST_KRW: ${GCP_HARD_STOP_ALL_IN_COST_KRW:-350000}
      GCP_COST_GUARD_WARNING_KRW: ${GCP_COST_GUARD_WARNING_KRW:-330000}
      GCP_COST_GUARD_DANGER_KRW: ${GCP_COST_GUARD_DANGER_KRW:-340000}
      GCP_HARD_STOP_NETWORK_GIB: ${GCP_HARD_STOP_NETWORK_GIB:-30}
      GCP_COST_GUARD_NETWORK_WARNING_GIB: ${GCP_COST_GUARD_NETWORK_WARNING_GIB:-15}
      GCP_COST_GUARD_NETWORK_DANGER_GIB: ${GCP_COST_GUARD_NETWORK_DANGER_GIB:-25}
      GCP_HARD_STOP_MAX_RUNTIME_HOURS: ${GCP_HARD_STOP_MAX_RUNTIME_HOURS:-1350}
      GCP_COST_GUARD_RUNTIME_WARNING_HOURS: ${GCP_COST_GUARD_RUNTIME_WARNING_HOURS:-1250}
      GCP_COST_GUARD_RUNTIME_DANGER_HOURS: ${GCP_COST_GUARD_RUNTIME_DANGER_HOURS:-1320}
      GCP_HARD_STOP_EXPECTED_BUDGET_KRW: ${GCP_HARD_STOP_EXPECTED_BUDGET_KRW:-370000}
      GCP_HARD_STOP_BUDGET_ID: ${GCP_HARD_STOP_BUDGET_ID:-}
      GCP_HARD_STOP_BILLING_ACCOUNT_ID: ${GCP_HARD_STOP_BILLING_ACCOUNT_ID:-}
      GCP_HARD_STOP_BUDGET_DISPLAY_NAME: ${GCP_HARD_STOP_BUDGET_DISPLAY_NAME:-GoLe production credit guard}
      GCP_HARD_STOP_PERIOD_START: ${GCP_HARD_STOP_PERIOD_START:-}
      GCP_VM_COST_START: ${GCP_VM_COST_START:-}
      GCP_HARD_STOP_AT: ${GCP_HARD_STOP_AT:-}
      GCP_HARD_STOP_ARM_ID: ${GCP_HARD_STOP_ARM_ID:-}
      GCP_INSTANCE_ZONE: ${GCP_INSTANCE_ZONE:-asia-northeast3-a}
      GCP_INSTANCE_NAME: ${GCP_INSTANCE_NAME:-gole-production}
      GCP_VAT_RATE: ${GCP_VAT_RATE:-0.10}
      GCP_NETWORK_EGRESS_KRW_PER_GIB: ${GCP_NETWORK_EGRESS_KRW_PER_GIB:-318.154399937}
      GCP_STOPPED_RESOURCE_HOURLY_COST_KRW: ${GCP_STOPPED_RESOURCE_HOURLY_COST_KRW:-45.725095000}
      GCP_COST_GUARD_INTERVAL_SECONDS: ${GCP_COST_GUARD_INTERVAL_SECONDS:-10}
      GCP_HARD_STOP_RETRY_SECONDS: ${GCP_HARD_STOP_RETRY_SECONDS:-300}
      BUDGET_HTTP_TIMEOUT_SECONDS: ${BUDGET_HTTP_TIMEOUT_SECONDS:-5}
      DISCORD_OPERATIONS_WEBHOOK_URL: ${DISCORD_OPERATIONS_WEBHOOK_URL:-}
    volumes:
      - budget-relay-state:/state
      # Mount the root-owned directory, not the socket inode. Broker restarts
      # replace broker.sock atomically and the relay must observe the new inode.
      - type: bind
        source: /run/gole-cloud-broker
        target: /run/gole-cloud-broker
        read_only: true
        bind:
          create_host_path: false
      - /sys/class/net/ens4/statistics/tx_bytes:/host-metrics/tx_bytes:ro
      - /proc/sys/kernel/random/boot_id:/host-metrics/boot_id:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,time; p='/tmp/gole-cost-guard-heartbeat'; raise SystemExit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<35 else 1)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  frontend:
    <<: *gole-security
    build:
      context: ../..
      dockerfile: infra/gcp/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://gole.co.kr
        NEXT_PUBLIC_SITE_URL: https://gole.co.kr
        NEXT_PUBLIC_PAYMENT_MODE: disabled
        NEXT_PUBLIC_PORTONE_STORE_ID: ${NEXT_PUBLIC_PORTONE_STORE_ID:-}
        NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${NEXT_PUBLIC_PORTONE_CHANNEL_KEY:-}
        NEXT_PUBLIC_PORTONE_CARD_CHANNEL_KEY: ${NEXT_PUBLIC_PORTONE_CARD_CHANNEL_KEY:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
    image: gole/frontend:local
    container_name: gole-frontend
    logging: *gole-logging
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 640m
    depends_on:
      backend:
        condition: service_healthy
    ports: ["127.0.0.1:3000:3000"]
    networks: [edge]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/icon.svg').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  nginx:
    <<: *gole-security
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: gole-nginx
    logging: *gole-logging
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 192m
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports: ["80:80", "443:443"]
    networks: [edge]
    volumes:
      - /etc/gole/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 3

  certbot:
    <<: *gole-security
    image: certbot/certbot:latest@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    logging: *gole-logging
    restart: "no"
    cpus: 0.5
    mem_limit: 256m
    profiles: ["certificate"]
    networks: [edge]
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  mongo-data:
    name: gole_mongo-data
  redis-data:
    name: gole_redis-data
  minio-data:
    name: gole_minio-data
  certbot-webroot:
    name: gole_certbot-webroot
  letsencrypt:
    name: gole_letsencrypt
  budget-relay-state:
    name: gole_budget-relay-state

networks:
  edge:
    name: gole_edge
  data:
    name: gole_data
    internal: true
  agent:
    name: gole_agent
    internal: true
